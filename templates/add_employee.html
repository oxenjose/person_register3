{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <h1>Lägg till anställd</h1>
</div>

<form method="POST" class="form-card">
    <div class="form-row">
        <div class="form-group">
            <label for="first_name">Förnamn *</label>
            <input type="text" id="first_name" name="first_name" required>
        </div>
        <div class="form-group">
            <label for="last_name">Efternamn *</label>
            <input type="text" id="last_name" name="last_name" required>
        </div>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label for="age">Ålder *</label>
            <input type="number" id="age" name="age" min="16" max="100" required>
        </div>
        <div class="form-group">
            <label for="gender">Kön *</label>
            <select id="gender" name="gender" required>
                <option value="">Välj...</option>
                <option value="Man">Man</option>
                <option value="Kvinna">Kvinna</option>
                <option value="Annat">Annat</option>
            </select>
        </div>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label for="employee_number">Anställningsnummer *</label>
            <input type="text" id="employee_number" name="employee_number" required>
        </div>
        <div class="form-group">
            <label for="email">E-post *</label>
            <input type="email" id="email" name="email" required>
        </div>
    </div>
    <div class="form-group">
        <label for="position">Cargo / Position *</label>
        <input type="text" id="position" name="position" required>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Spara anställd</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Avbryt</a>
    </div>
</form>
{% endblock %}
