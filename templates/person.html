{% extends 'base.html' %}

{% block content %}
    <h1>{{ person.name }}</h1>
    <ul>
        <li><strong>email:</strong> {{ person.email }}</li>
        <li><strong>age:</strong> {{ person.age }}</li>
        <li><strong>country:</strong> {{ person.country }}</li>
    </ul>
    <img src="{{ url_for('static', filename='images/' + person.image_filename) }}" alt="{{ person.name }}">
{% endblock %}
